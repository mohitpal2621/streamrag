services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: streamrag
      POSTGRES_PASSWORD: streamrag
      POSTGRES_DB: streamrag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamrag"]
      interval: 2s
      retries: 30

volumes:
  pgdata:
