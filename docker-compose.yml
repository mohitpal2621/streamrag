services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: streamrag
      POSTGRES_PASSWORD: streamrag
      POSTGRES_DB: streamrag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamrag"]
      interval: 2s
      retries: 30

  # Kafka-compatible broker for the pipeline, single node in dev mode.
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.5
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 2s
      retries: 30

  # BullMQ's job store and the sync locks.
  redis:
    image: redis:8.8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

volumes:
  pgdata:
